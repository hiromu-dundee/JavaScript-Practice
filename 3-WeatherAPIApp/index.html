<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div class="forecasts">
        <h1 class="location-name"></h1>
        <div class="main-display">

            <img class="weatherImage" alt="">
            <p id="temperature"></p>


        </div>
        <p class="telop"></p>
        <div class="details">
            <p class="humid"></p>
            <p class="wind"></p>
        </div>

        <ul class="forecasts-display"></ul>


    </div>

</body>

</html>
