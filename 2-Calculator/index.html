<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Calculator</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <p id="calculate-result">0</p>

    <div class="btn-content">

        <button id="clear" class="btn com">AC</button>
        <button id="plus-minus" class="btn com">+/-</button>
        <button id="percentage" class="btn com">%</button>
        <button id="div" class="btn sign" value="÷">÷</button>

        <button id="number-9" class="btn num" value="9">9</button>
        <button id="number-8" class="btn num" value="8">8</button>
        <button id="number-7" class="btn num" value="7">7</button>
        <button id="mul" class="btn sign" value="×">×</button>

        <button id="number-6" class="btn num" value="6">6</button>
        <button id="number-5" class="btn num" value="5">5</button>
        <button id="number-4" class="btn num" value="4">4</button>
        <button id="minus" class="btn sign" value="-">-</button>

        <button id="number-3" class="btn num" value="3">3</button>
        <button id="number-2" class="btn num" value="2">2</button>
        <button id="number-1" class="btn num" value="1">1</button>
        <button id="plus" class="btn sign" value="+">+</button>

        <button id="number-0" class="btn num big" value="0">0</button>
        <button id="point" class="btn num" value=".">.</button>
        <button id="equal" class="btn com">=</button>

    </div>



</body>

</html>
